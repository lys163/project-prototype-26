name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy host config files
        run: |
          cp /home/jang/spring-server/.env ${{ github.workspace }}/.env
          cp /home/jang/spring-server/docker-compose.yml ${{ github.workspace }}/docker-compose.yml
          cp -r /home/jang/spring-server/monitoring ${{ github.workspace }}/monitoring 2>/dev/null || true

      - name: Build & restart containers
        run: |
          cd ${{ github.workspace }}
          docker compose down
          docker compose up -d --build

      - name: Discord 알림
        if: always()
        uses: actions/github-script@v7
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.WEBHOOK;
            if (!webhook) core.setFailed("DISCORD_WEBHOOK_URL is empty");
      
            const ok = "${{ job.status }}" === "success";
            const title = ok ? "✅ 배포 성공" : "❌ 배포 실패";
            const color = ok ? 5763719 : 15548997;
      
            const commitMsg =
              context.payload?.head_commit?.message ||
              context.sha;
      
            const body = {
              embeds: [
                {
                  title,
                  description:
                    `**커밋:** ${commitMsg}\n` +
                    `**브랜치:** ${context.ref.replace("refs/heads/", "")}\n` +
                    `**작성자:** ${context.actor}`,
                  color
                }
              ]
            };
      
            const res = await fetch(webhook, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
            });
      
            const text = await res.text();
            core.info(`Discord status: ${res.status}, body: ${text}`);
            if (!res.ok) core.setFailed(`Discord webhook failed: ${res.status}`);


